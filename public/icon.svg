<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    
    <linearGradient id="copperGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    
    <radialGradient id="emeraldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="150" cy="150" r="130" fill="url(#emeraldGlow)"/>

  <g id="RecycleRing">
    <g id="River">
      <path d="M 60,180 C 90,260 210,260 240,180 C 190,230 110,230 80,170 Z" fill="url(#riverGrad)"/>
      <path d="M 75,190 C 110,240 190,240 220,190 C 180,215 120,215 90,185 Z" fill="#60A5FA" opacity="0.6"/>
      <path d="M 235,185 L 265,155 L 265,195 Q 245,195 235,185 Z" fill="#1E3A8A"/>
    </g>

    <g id="MetalScrap">
      <path d="M 255,140 C 275,60 210,20 150,35 C 195,45 225,80 225,145 Z" fill="url(#copperGrad)"/>
      <polygon points="250,95 265,90 260,75 245,83" fill="#B45309"/>
      <polygon points="233,55 245,45 235,33 223,45" fill="#D97706"/>
      <polygon points="200,25 205,10 190,5 185,23" fill="#F59E0B"/>
      <path d="M 160,25 L 125,45 L 165,60 L 150,45 Z" fill="#78350F"/>
      <path d="M 240,125 C 250,75 200,30 160,45 C 190,55 215,80 220,120 Z" fill="#94A3B8" opacity="0.8"/>
    </g>

    <g id="TreeNature">
      <path d="M 130,45 C 60,35 30,105 45,155 C 55,105 85,65 140,60 Z" fill="#78350F"/>
      <circle cx="100" cy="50" r="28" fill="#15803D"/>
      <circle cx="65" cy="70" r="32" fill="#22C55E"/>
      <circle cx="45" cy="110" r="22" fill="#4ADE80"/>
      <circle cx="35" cy="140" r="16" fill="#16A34A"/>
      <path d="M 50,145 L 30,180 L 15,140 Q 35,150 50,145 Z" fill="#14532D"/>
    </g>
  </g>

  <g id="Emerald" transform="translate(150, 150) scale(0.65) translate(-150, -150)">
    <polygon points="90,110 120,80 180,80 210,110 210,190 180,220 120,220 90,190" fill="#064E3B" stroke="#047857" stroke-width="4"/>
    <polygon points="90,110 120,80 135,105 115,125" fill="#34D399"/>
    <polygon points="120,80 180,80 165,105 135,105" fill="#10B981"/>
    <polygon points="180,80 210,110 185,125 165,105" fill="#059669"/>
    <polygon points="210,110 210,190 185,175 185,125" fill="#047857"/>
    <polygon points="90,110 90,190 115,175 115,125" fill="#059669"/>
    <polygon points="210,190 180,220 165,195 185,175" fill="#065F46"/>
    <polygon points="180,220 120,220 135,195 165,195" fill="#022C22"/>
    <polygon points="120,220 90,190 115,175 135,195" fill="#064E3B"/>
    <polygon points="115,125 135,105 165,105 185,125 185,175 165,195 135,195 115,175" fill="#6EE7B7"/>
    <polygon points="115,125 135,105 145,135" fill="#ffffff" opacity="0.8"/>
    <polygon points="185,175 165,195 155,165" fill="#A7F3D0" opacity="0.6"/>
  </g>
</svg>
